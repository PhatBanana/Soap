# Runs the behaviour test suite on every pull request.
#
# Deliberately stores nothing: no artifacts, no traces, no screenshots. Storage
# on this repo is the reason CI was skipped for so long, and a run that uploads
# nothing costs none of it — the pass/fail and the log are all we need, and logs
# aren't billed as storage. If a failure ever needs more than the log to
# diagnose, reproduce it locally with `npm test` rather than adding uploads here.
#
# Runs inside the official Playwright image so the browser is already there.
# Downloading it per run meant a CDN hiccup could turn the build red for reasons
# that had nothing to do with the code, and a red tick you learn to ignore is
# worse than no tick at all. The image tag must match the playwright version in
# package-lock.json — the test suite asserts that, so it can't quietly drift.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same PR makes the first run pointless — cancel it.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No browser install step: the image ships Chromium and its system libs,
      # and the suite falls through to Playwright's default resolution to find it.

      # Starts its own static server, drives the real app, and exits non-zero
      # on any failed assertion.
      - name: Run tests
        run: npm test
